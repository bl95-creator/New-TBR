<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PageTurner - Advanced TBR Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- HEADER -->
    <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700 sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="p-2.5 bg-indigo-600 rounded-xl shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-book-bookmark text-xl text-white"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">PageTurner</h1>
                    <p class="text-xs text-slate-400">Virtual Library & TBR Tracker (Powered by Open Library)</p>
                </div>
            </div>

            <!-- Export / Import Actions -->
            <div class="flex items-center gap-2">
                <button onclick="exportData()" title="Backup Library to File" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-medium rounded-lg transition flex items-center gap-1.5 border border-slate-600">
                    <i class="fa-solid fa-download"></i> Export JSON
                </button>
                <label title="Import Library Backup" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-medium rounded-lg transition flex items-center gap-1.5 border border-slate-600 cursor-pointer">
                    <i class="fa-solid fa-upload"></i> Import
                    <input type="file" id="importFileInput" accept=".json" class="hidden" onchange="importData(event)">
                </label>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full space-y-8">

        <!-- GLOBAL WEB SEARCH SECTION -->
        <section class="bg-slate-800/50 border border-slate-700/60 rounded-2xl p-6 shadow-xl backdrop-blur">
            <div class="max-w-2xl mx-auto space-y-4">
                <h2 class="text-center text-lg font-semibold text-slate-200">
                    Search the Open Public Library
                </h2>
                <div class="relative flex items-center">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 text-slate-400"></i>
                    <input type="text" id="searchInput" placeholder="Search web by title, author, or ISBN (e.g. Project Hail Mary)..." 
                        class="w-full pl-11 pr-24 py-3.5 bg-slate-900/80 border border-slate-600 rounded-xl focus:outline-none focus:border-indigo-500 text-sm text-slate-100 placeholder-slate-400 shadow-inner"
                        onkeydown="if(event.key === 'Enter') performSearch()">
                    <button onclick="performSearch()" class="absolute right-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg transition shadow-md">
                        Search Web
                    </button>
                </div>

                <!-- Suggested Quick Search Badges -->
                <div class="flex flex-wrap items-center justify-center gap-2 text-xs text-slate-400">
                    <span>Try searching:</span>
                    <button onclick="quickSearch('Project Hail Mary')" class="px-2.5 py-1 bg-slate-700/60 hover:bg-slate-700 text-slate-300 rounded-md transition">Project Hail Mary</button>
                    <button onclick="quickSearch('Atomic Habits')" class="px-2.5 py-1 bg-slate-700/60 hover:bg-slate-700 text-slate-300 rounded-md transition">Atomic Habits</button>
                    <button onclick="quickSearch('Fourth Wing')" class="px-2.5 py-1 bg-slate-700/60 hover:bg-slate-700 text-slate-300 rounded-md transition">Fourth Wing</button>
                </div>
            </div>

            <!-- Search Results Container -->
            <div id="searchResultsSection" class="hidden mt-8 pt-6 border-t border-slate-700/80 space-y-4">
                <div class="flex items-center justify-between">
                    <h3 class="text-sm font-semibold text-slate-300 flex items-center gap-2">
                        <i class="fa-solid fa-globe text-indigo-400"></i> Search Results
                    </h3>
                    <button onclick="clearSearch()" class="text-xs text-slate-400 hover:text-slate-200">
                        <i class="fa-solid fa-xmark"></i> Close Results
                    </button>
                </div>
                
                <!-- Loading State -->
                <div id="search
