<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PageTurner - To Be Read Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- HEADER -->
    <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700 sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="p-2.5 bg-indigo-600 rounded-xl shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid me-0 fa-book-bookmark text-xl text-white"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">PageTurner</h1>
                    <p class="text-xs text-slate-400">Virtual Library & TBR Tracker (Powered by Open Library)</p>
                </div>
            </div>

            <!-- Export / Import Actions -->
            <div class="flex items-center gap-2">
                <button onclick="exportData()" title="Backup Library to File" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-medium rounded-lg transition flex items-center gap-1.5 border border-slate-600">
                    <i class="fa-solid fa-download"></i> Export JSON
                </button>
                <label title="Import Library Backup" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-medium rounded-lg transition flex items-center gap-1.5 border border-slate-600 cursor-pointer">
                    <i class="fa-solid fa-upload"></i> Import
                    <input type="file" id="importFileInput" accept=".json" class="hidden" onchange="importData(event)">
                </label>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full space-y-8">

        <!-- SEARCH SECTION -->
        <section class="bg-slate-800/50 border border-slate-700/60 rounded-2xl p-6 shadow-xl backdrop-blur">
            <div class="max-w-2xl mx-auto space-y-4">
                <h2 class="text-center text-lg font-semibold text-slate-200">
                    Search the Open Public Library
                </h2>
                <div class="relative flex items-center">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 text-slate-400"></i>
                    <input type="text" id="searchInput" placeholder="Search by title, author, or ISBN (e.g. Project Hail Mary)..." 
                        class="w-full pl-11 pr-24 py-3.5 bg-slate-900/80 border border-slate-600 rounded-xl focus:outline-none focus:border-indigo-500 text-sm text-slate-100 placeholder-slate-400 shadow-inner"
                        onkeydown="if(event.key === 'Enter') performSearch()">
                    <button onclick="performSearch()" class="absolute right-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg transition shadow-md">
                        Search
                    </button>
                </div>

                <!-- Suggested Quick Search Badges -->
                <div class="flex flex-wrap items-center justify-center gap-2 text-xs text-slate-400">
                    <span>Try searching:</span>
                    <button onclick="quickSearch('Project Hail Mary')" class="px-2.5 py-1 bg-slate-700/60 hover:bg-slate-700 text-slate-300 rounded-md transition">Project Hail Mary</button>
                    <button onclick="quickSearch('Atomic Habits')" class="px-2.5 py-1 bg-slate-700/60 hover:bg-slate-700 text-slate-300 rounded-md transition">Atomic Habits</button>
                    <button onclick="quickSearch('Fourth Wing')" class="px-2.5 py-1 bg-slate-700/60 hover:bg-slate-700 text-slate-300 rounded-md transition">Fourth Wing</button>
                </div>
            </div>

            <!-- Search Results Container -->
            <div id="searchResultsSection" class="hidden mt-8 pt-6 border-t border-slate-700/80 space-y-4">
                <div class="flex items-center justify-between">
                    <h3 class="text-sm font-semibold text-slate-300 flex items-center gap-2">
                        <i class="fa-solid fa-globe text-indigo-400"></i> Search Results
                    </h3>
                    <button onclick="clearSearch()" class="text-xs text-slate-400 hover:text-slate-200">
                        <i class="fa-solid fa-xmark"></i> Close Results
                    </button>
                </div>
                
                <!-- Loading State -->
                <div id="searchSpinner" class="hidden py-8 text-center text-slate-400">
                    <i class="fa-solid fa-circle-notch fa-spin text-2xl text-indigo-500"></i>
                    <p class="mt-2 text-xs">Searching Open Library...</p>
                </div>

                <!-- Error Message -->
                <div id="searchError" class="hidden p-4 bg-rose-500/10 border border-rose-500/30 rounded-xl text-rose-300 text-xs text-center"></div>

                <!-- Grid of Results -->
                <div id="searchResultsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>
            </div>
        </section>

        <!-- SHELVES / TAB NAVIGATION -->
        <section class="space-y-6">
            <div class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-700 pb-4">
                <div class="flex items-center gap-2">
                    <button onclick="switchTab('tbr')" id="tab-tbr" class="px-4 py-2 rounded-xl font-medium text-xs sm:text-sm transition flex items-center gap-2 bg-indigo-600 text-white shadow-lg shadow-indigo-600/30">
                        <i class="fa-solid fa-bookmark"></i> To Be Read
                        <span id="badge-tbr" class="px-2 py-0.5 bg-indigo-800 text-indigo-100 rounded-full text-[10px]">0</span>
                    </button>
                    <button onclick="switchTab('reading')" id="tab-reading" class="px-4 py-2 rounded-xl font-medium text-xs sm:text-sm transition flex items-center gap-2 bg-slate-800 text-slate-400 hover:text-slate-200">
                        <i class="fa-solid fa-book-open"></i> Reading
                        <span id="badge-reading" class="px-2 py-0.5 bg-slate-700 text-slate-300 rounded-full text-[10px]">0</span>
                    </button>
                    <button onclick="switchTab('completed')" id="tab-completed" class="px-4 py-2 rounded-xl font-medium text-xs sm:text-sm transition flex items-center gap-2 bg-slate-800 text-slate-400 hover:text-slate-200">
                        <i class="fa-solid fa-circle-check"></i> Completed
                        <span id="badge-completed" class="px-2 py-0.5 bg-slate-700 text-slate-300 rounded-full text-[10px]">0</span>
                    </button>
                </div>

                <!-- Filter / Sort Controls -->
                <div class="flex items-center gap-2">
                    <select id="sortSelect" onchange="renderCurrentTab()" class="px-3 py-1.5 bg-slate-800 border border-slate-700 text-slate-300 text-xs rounded-lg focus:outline-none">
                        <option value="dateAdded">Sort: Date Added</option>
                        <option value="title">Sort: Title</option>
                        <option value="priority">Sort: Priority</option>
                    </select>
                </div>
            </div>

            <!-- Shelf Grid -->
            <div id="shelfGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>

            <!-- Empty Shelf State -->
            <div id="emptyShelfState" class="hidden py-16 text-center space-y-3 bg-slate-800/30 border border-dashed border-slate-700 rounded-2xl">
                <i class="fa-solid fa-book-skull text-4xl text-slate-600"></i>
                <p class="text-sm font-medium text-slate-400">No books on this shelf yet.</p>
                <p class="text-xs text-slate-500">Use the search bar above to discover and add books from the web!</p>
            </div>
        </section>
    </main>

    <!-- BOOK DETAIL & EDIT MODAL -->
    <div id="bookModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-lg w-full p-6 space-y-5 shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-200">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>

            <div class="flex gap-4">
                <img id="modalCover" src="" alt="Book Cover" class="w-24 h-36 object-cover rounded-lg shadow-md border border-slate-700 flex-shrink-0 bg-slate-900">
                <div class="space-y-1">
                    <h3 id="modalTitle" class="font-bold text-slate-100 text-base leading-snug"></h3>
                    <p id="modalAuthors" class="text-xs text-indigo-400"></p>
                    <p id="modalMeta" class="text-[11px] text-slate-400"></p>
                    <div id="modalDescription" class="text-xs text-slate-300 pt-2 max-h-20 overflow-y-auto leading-relaxed"></div>
                </div>
            </div>

            <hr class="border-slate-700">

            <!-- Modal Inputs -->
            <div class="space-y-4 text-xs">
                <div>
                    <label class="block font-medium text-slate-300 mb-1">Shelf Status</label>
                    <select id="modalShelf" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-lg text-slate-200">
                        <option value="tbr">To Be Read (TBR)</option>
                        <option value="reading">Currently Reading</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-medium text-slate-300 mb-1">Priority</label>
                        <select id="modalPriority" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-lg text-slate-200">
                            <option value="low">Low Priority</option>
                            <option value="medium">Medium Priority</option>
                            <option value="high">High Priority</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-medium text-slate-300 mb-1">Rating (1-5)</label>
                        <select id="modalRating" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-lg text-slate-200">
                            <option value="0">Not Rated</option>
                            <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                            <option value="4">⭐⭐⭐⭐ (4/5)</option>
                            <option value="3">⭐⭐⭐ (3/5)</option>
                            <option value="2">⭐⭐ (2/5)</option>
                            <option value="1">⭐ (1/5)</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block font-medium text-slate-300 mb-1">Personal Notes & Thoughts</label>
                    <textarea id="modalNotes" rows="3" placeholder="Add custom notes, recommended by, or takeaways..." class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-lg text-slate-200 placeholder-slate-500"></textarea>
                </div>

                <!-- External Search Links -->
                <div class="pt-2 border-t border-slate-700/60 flex items-center justify-between">
                    <span class="text-[11px] text-slate-400">Search Options:</span>
                    <div class="flex items-center gap-2">
                        <a id="modalWorldCatLink" href="#" target="_blank" class="px-2.5 py-1 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded text-[11px] flex items-center gap-1">
                            <i class="fa-solid fa-building-columns"></i> WorldCat
                        </a>
                        <a id="modalOpenLibLink" href="#" target="_blank" class="px-2.5 py-1 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded text-[11px] flex items-center gap-1">
                            <i class="fa-solid fa-book text-indigo-400"></i> Open Library
                        </a>
                    </div>
                </div>
            </div>

            <!-- Modal Actions -->
            <div class="flex items-center justify-between pt-2">
                <button onclick="removeBookFromModal()" class="px-3 py-2 bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 font-medium rounded-lg text-xs transition border border-rose-500/30">
                    <i class="fa-solid fa-trash"></i> Remove
                </button>
                <div class="flex items-center gap-2">
                    <button onclick="closeModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-300 font-medium rounded-lg text-xs transition">
                        Cancel
                    </button>
                    <button onclick="saveModalChanges()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg text-xs transition shadow-md">
                        Save Changes
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // App State
        let myLibrary = [];
        let activeTab = 'tbr';
        let activeModalBookId = null;

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            loadLibraryFromStorage();
            renderCurrentTab();
            updateTabBadges();
        });

        // Search Open Library API
        async function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            const resultsSection = document.getElementById('searchResultsSection');
            const spinner = document.getElementById('searchSpinner');
            const errorContainer = document.getElementById('searchError');
            const grid = document.getElementById('searchResultsGrid');

            resultsSection.classList.remove('hidden');
            spinner.classList.remove('hidden');
            errorContainer.classList.add('hidden');
            grid.innerHTML = '';

            try {
                // Open Library Search Endpoint
                const response = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(query)}&limit=12`);
                if (!response.ok) throw new Error('Open Library returned status ' + response.status);
                
                const data = await response.json();
                spinner.classList.add('hidden');

                if (!data.docs || data.docs.length === 0) {
                    errorContainer.textContent = 'No books found. Try refining your title or author search.';
                    errorContainer.classList.remove('hidden');
                    return;
                }

                data.docs.forEach(doc => {
                    const coverId = doc.cover_i;
                    const coverUrl = coverId 
                        ? `https://covers.openlibrary.org/b/id/${coverId}-M.jpg` 
                        : 'https://via.placeholder.com/128x192?text=No+Cover';
                    
                    const book = {
                        id: doc.key ? doc.key.replace('/works/', '') : 'ol_' + Math.random().toString(36).substr(2, 9),
                        key: doc.key || '',
                        title: doc.title || 'Unknown Title',
                        authors: doc.author_name ? doc.author_name.join(', ') : 'Unknown Author',
                        publishedDate: doc.first_publish_year || 'N/A',
                        pageCount: doc.number_of_pages_median || null,
                        description: doc.first_sentence ? doc.first_sentence.join(' ') : 'Available on Open Library.',
                        coverUrl: coverUrl,
                        isbn: doc.isbn ? doc.isbn[0] : null
                    };

                    const card = createSearchCard(book);
                    grid.appendChild(card);
                });

            } catch (err) {
                spinner.classList.add('hidden');
                errorContainer.textContent = 'Error connecting to Open Library: ' + err.message;
                errorContainer.classList.remove('hidden');
            }
        }

        function quickSearch(term) {
            document.getElementById('searchInput').value = term;
            performSearch();
        }

        function clearSearch() {
            document.getElementById('searchResultsSection').classList.add('hidden');
            document.getElementById('searchInput').value = '';
        }

        // Render Search Card Component
        function createSearchCard(book) {
            const isSaved = myLibrary.some(b => b.id === book.id);
            const card = document.createElement('div');
            card.className = "bg-slate-900 border border-slate-700/80 rounded-xl p-3 flex flex-col justify-between space-y-2 hover:border-slate-600 transition shadow";

            card.innerHTML = `
                <div class="space-y-2">
                    <img src="${book.coverUrl}" alt="${escapeHtml(book.title)}" class="w-full h-36 object-cover rounded-lg bg-slate-800" onerror="this.src='https://via.placeholder.com/128x192?text=No+Cover'">
                    <div>
                        <h4 class="font-bold text-xs text-slate-100 line-clamp-1" title="${escapeHtml(book.title)}">${escapeHtml(book.title)}</h4>
                        <p class="text-[11px] text-slate-400 line-clamp-1">${escapeHtml(book.authors)}</p>
                    </div>
                </div>
                <button onclick='addBookToLibrary(${JSON.stringify(book).replace(/'/g, "&apos;")})' 
                    class="w-full py-1.5 ${isSaved ? 'bg-slate-800 text-slate-400 border border-slate-700' : 'bg-indigo-600 hover:bg-indigo-500 text-white'} text-[11px] font-semibold rounded-lg transition flex items-center justify-center gap-1">
                    <i class="fa-solid ${isSaved ? 'fa-check' : 'fa-plus'}"></i> ${isSaved ? 'In Library' : 'Add to TBR'}
                </button>
            `;
            return card;
        }

        // Library Management
        function addBookToLibrary(bookData) {
            const existingIndex = myLibrary.findIndex(b => b.id === bookData.id);
            if (existingIndex !== -1) {
                openModal(bookData.id);
                return;
            }

            const newBook = {
                ...bookData,
                shelf: 'tbr',
                priority: 'medium',
                rating: 0,
                notes: '',
                dateAdded: new Date().toISOString()
            };

            myLibrary.push(newBook);
            saveLibraryToStorage();
            renderCurrentTab();
            updateTabBadges();
            performSearch();
        }

        function switchTab(tab) {
            activeTab = tab;
            ['tbr', 'reading', 'completed'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (t === tab) {
                    btn.className = "px-4 py-2 rounded-xl font-medium text-xs sm:text-sm transition flex items-center gap-2 bg-indigo-600 text-white shadow-lg shadow-indigo-600/30";
                } else {
                    btn.className = "px-4 py-2 rounded-xl font-medium text-xs sm:text-sm transition flex items-center gap-2 bg-slate-800 text-slate-400 hover:text-slate-200";
                }
            });
            renderCurrentTab();
        }

        function renderCurrentTab() {
            const grid = document.getElementById('shelfGrid');
            const emptyState = document.getElementById('emptyShelfState');
            const sortBy = document.getElementById('sortSelect').value;

            grid.innerHTML = '';
            
            let filtered = myLibrary.filter(b => b.shelf === activeTab);

            // Sorting logic
            filtered.sort((a, b) => {
                if (sortBy === 'title') return a.title.localeCompare(b.title);
                if (sortBy === 'priority') {
                    const pMap = { high: 3, medium: 2, low: 1 };
                    return pMap[b.priority] - pMap[a.priority];
                }
                return new Date(b.dateAdded) - new Date(a.dateAdded);
            });

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                grid.classList.add('hidden');
            } else {
                emptyState.classList.add('hidden');
                grid.classList.remove('hidden');

                filtered.forEach(book => {
                    const card = createShelfCard(book);
                    grid.appendChild(card);
                });
            }
        }

        function createShelfCard(book) {
            const card = document.createElement('div');
            card.className = "bg-slate-800 border border-slate-700/80 rounded-xl p-3 flex flex-col justify-between space-y-3 hover:border-slate-600 transition shadow-lg cursor-pointer group";
            card.onclick = () => openModal(book.id);

            const priorityColors = {
                high: 'bg-rose-500/20 text-rose-300 border-rose-500/30',
                medium: 'bg-amber-500/20 text-amber-300 border-amber-500/30',
                low: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30'
            };

            card.innerHTML = `
                <div class="space-y-2">
                    <div class="relative">
                        <img src="${book.coverUrl}" alt="${escapeHtml(book.title)}" class="w-full h-40 object-cover rounded-lg bg-slate-900" onerror="this.src='https://via.placeholder.com/128x192?text=No+Cover'">
                        <span class="absolute top-2 right-2 px-2 py-0.5 text-[10px] font-bold rounded-md border ${priorityColors[book.priority]} backdrop-blur">
                            ${book.priority.toUpperCase()}
                        </span>
                    </div>
                    <div>
                        <h4 class="font-bold text-xs text-slate-100 line-clamp-1 group-hover:text-indigo-400 transition" title="${escapeHtml(book.title)}">${escapeHtml(book.title)}</h4>
                        <p class="text-[11px] text-slate-400 line-clamp-1">${escapeHtml(book.authors)}</p>
                    </div>
                </div>
                <div class="flex items-center justify-between pt-1 border-t border-slate-700/60 text-[11px] text-slate-400">
                    <span>${book.rating > 0 ? '⭐ '.repeat(book.rating) : 'Unrated'}</span>
                    <i class="fa-solid fa-pen-to-square text-slate-500 group-hover:text-slate-300"></i>
                </div>
            `;
            return card;
        }

        // Modal Handling
        function openModal(bookId) {
            const book = myLibrary.find(b => b.id === bookId);
            if (!book) return;

            activeModalBookId = bookId;
            document.getElementById('modalCover').src = book.coverUrl;
            document.getElementById('modalTitle').textContent = book.title;
            document.getElementById('modalAuthors').textContent = `By ${book.authors}`;
            document.getElementById('modalMeta').textContent = `${book.pageCount ? book.pageCount + ' pages • ' : ''}Published: ${book.publishedDate}`;
            document.getElementById('modalDescription').textContent = book.description;

            document.getElementById('modalShelf').value = book.shelf;
            document.getElementById('modalPriority').value = book.priority;
            document.getElementById('modalRating').value = book.rating;
            document.getElementById('modalNotes').value = book.notes || '';

            // Update external search links
            const query = encodeURIComponent(`${book.title} ${book.authors}`);
            document.getElementById('modalWorldCatLink').href = `https://www.worldcat.org/search?q=${query}`;
            document.getElementById('modalOpenLibLink').href = book.key ? `https://openlibrary.org${book.key}` : `https://openlibrary.org/search?q=${query}`;

            document.getElementById('bookModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('bookModal').classList.add('hidden');
            activeModalBookId = null;
        }

        function saveModalChanges() {
            if (!activeModalBookId) return;
            const book = myLibrary.find(b => b.id === activeModalBookId);
            if (book) {
                book.shelf = document.getElementById('modalShelf').value;
                book.priority = document.getElementById('modalPriority').value;
                book.rating = parseInt(document.getElementById('modalRating').value);
                book.notes = document.getElementById('modalNotes').value.trim();

                saveLibraryToStorage();
                renderCurrentTab();
                updateTabBadges();
            }
            closeModal();
        }

        function removeBookFromModal() {
            if (!activeModalBookId) return;
            myLibrary = myLibrary.filter(b => b.id !== activeModalBookId);
            saveLibraryToStorage();
            renderCurrentTab();
            updateTabBadges();
            closeModal();
        }

        function updateTabBadges() {
            document.getElementById('badge-tbr').textContent = myLibrary.filter(b => b.shelf === 'tbr').length;
            document.getElementById('badge-reading').textContent = myLibrary.filter(b => b.shelf === 'reading').length;
            document.getElementById('badge-completed').textContent = myLibrary.filter(b => b.shelf === 'completed').length;
        }

        // Local Storage & Import/Export
        function saveLibraryToStorage() {
            localStorage.setItem('pageturner_library', JSON.stringify(myLibrary));
        }

        function loadLibraryFromStorage() {
            const data = localStorage.getItem('pageturner_library');
            if (data) {
                try {
                    myLibrary = JSON.parse(data);
                } catch (e) {
                    console.error("Failed to parse local storage library data");
                }
            }
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(myLibrary, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `pageturner_library_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (Array.isArray(importedData)) {
                        myLibrary = importedData;
                        saveLibraryToStorage();
                        renderCurrentTab();
                        updateTabBadges();
                        alert('Library successfully imported!');
                    } else {
                        alert('Invalid backup file format.');
                    }
                } catch (err) {
                    alert('Error reading JSON file: ' + err.message);
                }
            };
            reader.readAsText(file);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }
    </script>
